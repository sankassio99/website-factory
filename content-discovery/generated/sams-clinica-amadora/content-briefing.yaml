organization:
  name: SAMS
  summary: >
    SAMS (Serviços de Assistência Médico-Social) is described on its own site as
    the largest private health subsystem in Portugal, managed by the Sindicato
    da Banca, Seguros e Tecnologias – MAIS Sindicato. Its network includes the
    Hospital SAMS, the Centro Clínico de Lisboa, 17 clinics across the country,
    an optical service, a pharmacy ("parafarmácia"), and a care home for the
    elderly. SAMS provides health coverage to its beneficiaries complementary to
    Portugal's national health service (SNS), and also serves private patients,
    insurance-company patients, and users covered by agreements/partnerships.
  evidence_url: https://www.sams.pt/QuemSomos/Paginas/Apresentacao.aspx

  unit:
    name: Clínica SAMS Amadora
    address: "Rua Elias Garcia, 219 | 2700-318 Amadora, Portugal"
    email: clinica.amadora@sams.pt
    hours: "Dias úteis das 08:00 às 20:00 (weekdays 08:00–20:00)"
    who_can_access: >
      SAMS beneficiaries, family users, users under Acordos/Parcerias/Seguradoras
      (agreements/partnerships/insurers), and private (particular) patients.
    nearby_references:
