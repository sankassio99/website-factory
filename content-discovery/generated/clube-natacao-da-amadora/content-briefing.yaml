unresolved_questions:
  - >-
    The homepage advertises registrations for September 2024 to July 2025; the
    currently available season and pool status are unverified.
  - >-
    The discounts page refers to a "fase transitória" without a date, and its
    linked graphic may contain additional details not transcribed here.
  - >-
    Only three pages were reviewed. Other homepage links, including the ranking,
    energy-efficiency, latest-news, and next-page destinations, remain
    unreviewed.
  - >-
    The homepage also has a blankly labeled link to http://natacaoamadora.pt/esc.htm;
    a shared browser tab showed a 404 page there, so no page content was included.
  - >-
    The homepage refers to 42 years of activity and separately to a 40-year
    celebration; the date relationship is not established.
