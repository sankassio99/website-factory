schema_version: 1
name: community-aquatics-club
source:
  url: http://www.natacaoamadora.pt/
  analyzed_at: 2026-10-05
  analyzed_pages:
    - url: http://www.natacaoamadora.pt/
      page_type: home
    - url: http://www.natacaoamadora.pt/index2.html
      page_type: services-index
    - url: http://www.natacaoamadora.pt/beneficios.htm
      page_type: informational-poster
    - url: http://www.natacaoamadora.pt/ranking.htm
      page_type: club-update-poster
    - url: http://www.natacaoamadora.pt/Central.htm
      page_type: sustainability-update
    - url: http://www.natacaoamadora.pt/abre.htm
      page_type: operational-notice
    - url: http://www.natacaoamadora.pt/desconto.htm
      page_type: location-status-and-offer
design_system:
  palette:
    - name: page-background
      hex: "#FFFFFF"
      usage: White canvas visible on the standalone notice page
      confidence: observed
    - name: link
      hex: "#FF0000"
      usage: Legacy unvisited link color on the home page
      confidence: observed
    - name: visited-link
      hex: "#8C1717"
      usage: Legacy visited-link color and some emphasis text
      confidence: observed
    - name: accent-magenta
      hex: "#CC2290"
      usage: Promotional or notice emphasis
      confidence: observed
    - name: accent-olive
      hex: "#4F4F2F"
      usage: Supporting announcement text
      confidence: observed
    - name: textured-surface
      hex: "#F2F2F2"
      usage: Approximate light neutral suggested by the visibly textured home-page background
      confidence: approximate
  typography:
    - role: body
      family: "Times New Roman"
      confidence: observed
    - role: announcement
      family: "Comic Sans MS"
      confidence: observed
    - role: supporting-display
      family: "Book Antiqua"
      confidence: observed
  shape:
    border_radius: "Mostly square legacy layout; explicit reusable radius not observed"
  layout:
    breakpoints: []
    spacing_scale: []
    patterns:
      - "Long-form home page with a narrow link rail alongside a broad announcement area"
      - "Fixed-width, table-like content blocks and poster-style image pages"
      - "Centered standalone notice content with a return link"
      - "Sequential continuation link to a second services page"
pages:
  - page_type: home
    purpose: Introduce the club, surface current service status, and route visitors to key information.
    sections:
      - name: identity-header
        content_role: Identify the organization and communicate its public-service credentials.
        layout_pattern: Centered identity block with logo and stacked supporting statements
        components: [organization-mark-slot, organization-name, credential-list]
      - name: priority-links
        content_role: Provide shortcuts to membership offers, club information, service updates, and notices.
        layout_pattern: Narrow side rail of prominent text links
        components: [link-list, featured-link]
      - name: urgent-update
        content_role: Explain an important service or organizational update.
        layout_pattern: High-contrast full-width announcement block
        components: [announcement-heading, explanatory-copy]
      - name: service-status
        content_role: Show which facilities are open and any current enrollment period.
        layout_pattern: Large, prominent status statement followed by detail
        components: [status-banner, enrollment-summary, location-list]
      - name: club-news-and-impact
        content_role: Share club milestones, facility investments, and community updates.
        layout_pattern: Stacked editorial announcements with optional supporting media
        components: [news-item, image-slot, supporting-copy]
      - name: benefits-teaser
        content_role: Introduce the benefits of the club's aquatic activities and link to a fuller explanation.
        layout_pattern: Short teaser within the home-page content flow
        components: [section-heading, supporting-copy, text-link]
      - name: continuation-and-support
        content_role: Continue into the service catalog and acknowledge supporting organizations.
        layout_pattern: Centered continuation link with partner-logo slots
        components: [continuation-link, partner-logo-list]
  - page_type: services-index
    purpose: Present the club's activity and training categories and route visitors to service details.
    sections:
      - name: activity-catalog
        content_role: Group aquatic classes, training, rehabilitation, events, and competitive activities.
        layout_pattern: Simple linked list or category grid
        components: [category-heading, service-link-list, optional-new-item-badge]
      - name: return-navigation
        content_role: Return visitors to the club's primary information page.
        layout_pattern: Plain text link
        components: [back-link]
  - page_type: informational-poster
    purpose: Communicate one focused health, activity, or participation message.
    sections:
      - name: poster-content
        content_role: Present the topic as a single prominent visual with a return path.
        layout_pattern: Large poster/image slot with minimal surrounding text
        components: [poster-image-slot, back-link]
  - page_type: club-update-poster
    purpose: Publish a focused milestone, season, or club update.
    sections:
      - name: update-content
        content_role: Present the current update in a highly visual, single-page format.
        layout_pattern: Large poster/image slot with a return path
        components: [update-image-slot, back-link]
  - page_type: sustainability-update
    purpose: Explain an environmental or facility-efficiency project and its community relevance.
    sections:
      - name: project-summary
        content_role: Describe the project, its facility context, and any supporting partner.
        layout_pattern: Poster or project image followed by concise supporting details
        components: [project-image-slot, project-summary, partner-credit]
      - name: return-navigation
        content_role: Return visitors to the club's main information page.
        layout_pattern: Plain text link
        components: [back-link]
  - page_type: operational-notice
    purpose: Announce a temporary operational change or reopening status.
    sections:
      - name: notice
        content_role: Explain the operational change and its effective scope.
        layout_pattern: Single image-led notice with a return path
        components: [notice-image-slot, back-link]
  - page_type: location-status-and-offer
    purpose: Combine a location-specific service status with a time-sensitive enrollment offer.
    sections:
      - name: offer-poster
        content_role: Present an offer or enrollment campaign as a prominent visual.
        layout_pattern: Wide poster image
        components: [offer-image-slot]
      - name: location-status
        content_role: Clarify which locations or services are currently available.
        layout_pattern: Centered, high-contrast status statements
        components: [status-heading, location-list]
      - name: return-navigation
        content_role: Return visitors to the main page.
        layout_pattern: Centered text link
        components: [back-link]
responsive_observations:
  source_behavior: "At a 390px browser viewport a home-page table measured about 785px wide and extended beyond the viewport."
  template_guidance: "Rebuild as fluid, semantic sections; collapse the link rail into a stacked or accessible menu and prevent horizontal overflow."
accessibility_observations:
  - "Several observed home-page images had empty alternative text."
  - "Important messages and navigation are partly communicated through image posters and color emphasis."
  - "Use semantic headings, descriptive link text, and equivalent text for any poster content in a new implementation."
