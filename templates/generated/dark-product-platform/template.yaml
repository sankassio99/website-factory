template:
  name: Dark Product Platform
  slug: dark-product-platform
  category: product-platform
  description: A restrained dark-theme marketing template for digital product platforms that need to explain capabilities, establish credibility, and guide visitors to a product action.
  source_analysis:
    reference_type: public-reference-partial-analysis
    analyzed_at: "2026-10-01"
    confidence: partial
design:
  visual_style: Precise, dark, product-led, and content-first with clear hierarchy and minimal decorative treatment.
  colors:
    canvas:
      value: Dark neutral canvas selected for the new brand.
      basis: Observed
      approximate: true
    surface:
      value: Slightly elevated dark surface selected for the new brand.
      basis: Default
      approximate: false
    text:
      value: High-contrast light text selected to meet accessibility requirements.
      basis: Default
      approximate: false
    accent:
      value: Brand-controlled accent reserved for primary actions and status emphasis.
      basis: Default
      approximate: false
  typography:
    heading:
      value: Compact modern sans-serif selected by the new brand.
      basis: Default
      approximate: false
    body:
      value: Neutral sans-serif with readable line height and strong contrast.
      basis: Default
      approximate: false
  spacing:
    value: Consistent four- or eight-point scale with generous page-section spacing.
    basis: Default
    approximate: false
  borders:
    value: Low-contrast neutral borders used to organize dark surfaces.
    basis: Default
    approximate: false
  shadows:
    value: Minimal elevation; separate layers with contrast, borders, and spacing first.
    basis: Default
    approximate: false
layout:
  container: Centered responsive container with controlled reading width and full-bleed visual panels only where needed.
  grid: One column on mobile, two-column conversion sections, and three-column capability groups on large screens.
  responsive: Preserve primary product action and reading order as grids collapse; do not hide required information behind hover.
navigation:
  variant: Compact product navigation with a single emphasized primary action.
  behavior: Horizontal navigation on desktop and accessible disclosure navigation on mobile.
pages:
  - type: home
    purpose: Introduce a digital product platform, explain its most relevant capabilities, establish credibility, and lead visitors toward the primary product action.
    sections:
      - component: navigation
        variant: compact-product-nav
      - component: hero
        variant: product-led
      - component: capability-grid
        variant: outcome-oriented
      - component: workflow-panel
        variant: guided-product-flow
      - component: proof-grid
        variant: organization-proof
      - component: cta
        variant: focused-product-action
      - component: footer
        variant: product-footer
components:
  - name: navigation
    type: navigation
    purpose: Help visitors reach key product, customer, pricing, and resource paths while retaining a visible primary action.
    variant: compact-product-nav
    configuration:
      content_structure:
        - brand-slot
        - primary-navigation
        - primary-action
    responsive_behavior: Use a keyboard-operable disclosure menu on narrow screens and retain access to the primary action.
  - name: hero
    type: hero
    purpose: State the product value, frame the intended user outcome, and present a primary action without source-specific copy.
    variant: product-led
    configuration:
      content_structure:
        - eyebrow
        - heading
        - supporting-copy
        - primary-action
        - optional-secondary-action
        - product-visual-slot
    responsive_behavior: Stack copy and product visual in source order and avoid making the action dependent on media.
  - name: capability-grid
    type: feature-grid
    purpose: Explain a concise set of product capabilities through outcome-focused cards.
    variant: outcome-oriented
    configuration:
      columns:
        desktop: 3
        tablet: 2
        mobile: 1
      card_content:
        - capability-name
        - outcome
        - optional-link
    responsive_behavior: Collapse cards to readable columns while preserving content order and equal action access.
  - name: workflow-panel
    type: product-demonstration
    purpose: Explain how a representative workflow moves from planning to outcome.
    variant: guided-product-flow
    configuration:
      content_structure:
        - step-label
        - concise-explanation
        - product-visual-slot
        - supporting-action
    responsive_behavior: Render steps as a vertical sequence on narrow screens; do not require animation for comprehension.
  - name: proof-grid
    type: social-proof
    purpose: Present approved customer, adoption, or trust evidence without fabricated claims.
    variant: organization-proof
    configuration:
      content_structure:
        - proof-statement
        - approved-logo-or-quote
        - optional-case-study-link
    responsive_behavior: Stack proof units and avoid auto-rotating content.
  - name: cta
    type: call-to-action
    purpose: Repeat the primary product action after visitors have evaluated the capabilities and evidence.
    variant: focused-product-action
    configuration:
      content_structure:
        - heading
        - supporting-copy
        - primary-action
    responsive_behavior: Keep action size and contrast accessible on every viewport.
  - name: footer
    type: footer
    purpose: Provide secondary navigation, legal links, support paths, and brand-controlled social links.
    variant: product-footer
    configuration:
      content_structure:
        - product-navigation
        - resource-navigation
        - legal-navigation
        - optional-social-links
    responsive_behavior: Stack navigation groups in a logical reading order.
patterns:
  - name: Dark product canvas
    category: visual
    description: Use a dark neutral foundation with accessible contrast and restrained elevation, avoiding reference-specific color values.
    basis: Observed
  - name: Product-led conversion
    category: ux
    description: Lead with a concise product outcome and a clear primary action, supported by capability and workflow explanations.
    basis: Inferred
  - name: Editorial trust path
    category: information-architecture
    description: Keep customer proof, pricing, and educational resources as distinct reusable paths when the new product needs them.
    basis: Observed
responsive:
  mobile: Single-column content, accessible disclosure navigation, stacked product panels, and primary actions visible without hover.
  tablet: Two-column product or capability layouts only when text remains readable and touch targets remain spacious.
  desktop: Compact horizontal navigation, product-led split sections, and three-column capability groups with controlled line length.
seo:
  recommended_structure:
    - Use one descriptive title and meta description per route based on the new product.
    - Use one h1 with sequential headings that explain product outcomes and capabilities.
    - Add canonical, Open Graph, and structured metadata only when the new product has approved URLs and assets.
traceability:
  - decision: Dark neutral foundation
    basis: Observed
    note: The public root document declared a dark theme; exact values were not extracted.
  - decision: Product, customer-proof, pricing, and editorial-resource paths
    basis: Observed
    note: Derived from publicly accessible route purposes without copying their content.
  - decision: Hero, capability grid, workflow panel, and conversion CTA
    basis: Default
    note: Safe generic product-platform structure because rendered homepage sections were not fully available.
  - decision: Responsive navigation and grid behavior
    basis: Default
    note: Browser-based responsive inspection was unavailable.
