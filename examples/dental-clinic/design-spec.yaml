project: Lisbon Family Dental
visual_direction:
  summary: Calm, contemporary healthcare design that prioritizes clarity, comfort, and trust over decorative effects.
  tone: Reassuring and professional.
  references:
    - Use generous whitespace and clinical clarity.
    - Avoid stock-photo-heavy or generic AI aesthetic.
color_system:
  primary: "#0F766E"
  secondary: "#115E59"
  accent: "#F59E0B"
  surface: "#F8FAFC"
  text: "#0F172A"
typography:
  heading: Manrope, sans-serif
  body: Inter, sans-serif
  scale: Fluid type scale with clear page, section, and body hierarchy.
layout:
  grid: Mobile-first single column, expanding to a centered twelve-column desktop grid.
  spacing: Four-point spacing scale with generous vertical rhythm between content groups.
  component_hierarchy:
    - Site header
    - Primary navigation
    - Hero
    - Service cards
    - Trust content
    - Appointment request form
    - Footer
components:
  - name: Primary button
    purpose: Lead visitors to the appointment request action.
    states:
      - default
      - hover
      - focus-visible
      - disabled
  - name: Service card
    purpose: Summarize a dental care category and link to details.
    states:
      - default
      - hover
  - name: Appointment request form
    purpose: Collect an enquiry with clear labels and validation feedback.
    states:
      - idle
      - validation error
      - submitting
      - success
      - failure
responsive:
  mobile: Keep one clear call to action, stacked cards, and a collapsible accessible navigation menu.
  tablet: Use two-column service cards where readable and maintain comfortable touch targets.
  desktop: Use a twelve-column grid, persistent navigation, and balanced hero content with supporting media.
accessibility:
  - Use semantic landmarks, one h1 per page, and sequential headings.
  - Keep keyboard focus visible and all controls keyboard operable.
  - Associate every form control with a visible label and descriptive error text.
  - Verify color contrast to WCAG 2.2 AA and respect reduced-motion preferences.
