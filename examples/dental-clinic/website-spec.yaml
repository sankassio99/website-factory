project:
  name: Lisbon Family Dental
  description: Professional website for a family dental clinic in Lisbon.
  type: business
  language: pt
  locale: pt-PT
business:
  name: Lisbon Family Dental
  description: A fictional family dental clinic offering preventative, restorative, and cosmetic care.
  industry: Dental care
  location: Lisbon, Portugal
  target_audience: Adults and families in Lisbon seeking clear, trustworthy dental care.
brand:
  colors:
    primary: "#0F766E"
    secondary: "#115E59"
    accent: "#F59E0B"
    background: "#F8FAFC"
    text: "#0F172A"
  typography:
    heading: Manrope
    body: Inter
  tone: Calm, professional, reassuring, and plain-spoken.
assets:
  logo: TODO
  images:
    - "TODO: licensed clinic exterior photograph"
    - "TODO: licensed care-team photograph"
pages:
  - path: /
    name: Início
    purpose: Explain the clinic's value, services, and appointment path.
    sections:
      - name: Hero
        purpose: Present family-focused dental care in Lisbon and a booking action.
      - name: Serviços
        purpose: Introduce preventative, restorative, and cosmetic care.
      - name: Equipa
        purpose: Build trust with care-team credentials once supplied.
      - name: Testemunhos
        purpose: Present approved patient feedback if available.
      - name: Contactos
        purpose: Provide booking and clinic contact options.
  - path: /servicos
    name: Serviços
    purpose: Explain available treatments and guide visitors to an appointment.
    sections:
      - name: Preventiva
        purpose: Describe check-ups and hygiene appointments.
      - name: Restauradora
        purpose: Describe fillings and restorative options.
      - name: Estética
        purpose: Describe cosmetic treatment consultation options.
  - path: /contactos
    name: Contactos
    purpose: Let visitors request an appointment and find the clinic.
    sections:
      - name: Formulário
        purpose: Collect appointment-request details with consent.
      - name: Localização
        purpose: Explain how to reach the clinic.
features:
  - name: Appointment request form
    description: Let visitors request contact for a dental appointment without promising a confirmed booking.
  - name: Click-to-call
    description: Allow mobile visitors to start a phone call from the contact details.
navigation:
  items:
    - label: Início
      path: /
    - label: Serviços
      path: /servicos
    - label: Contactos
      path: /contactos
seo:
  title: Lisbon Family Dental | Clínica dentária em Lisboa
  description: Clínica dentária familiar em Lisboa com cuidados preventivos, restauradores e estéticos.
  keywords:
    - clínica dentária Lisboa
    - dentista Lisboa
    - higiene oral Lisboa
  locale: pt-PT
technology:
  framework: Next.js
  styling: Tailwind CSS
  package_manager: npm
deployment:
  provider: Vercel
open_questions:
  - "NEEDS_INPUT: clinic address, telephone number, and business hours"
  - "NEEDS_INPUT: approved practitioner credentials and biographies"
  - "NEEDS_INPUT: logo, photography, consented testimonials, and privacy copy"
