template:
  name: Modern Professional Services
  slug: modern-professional-services
  category: professional-services
  description: Calm, credible marketing structure for service businesses that need to explain expertise and prompt an enquiry.
  source_analysis:
    reference_type: fictional-example
    analyzed_at: "2026-10-01"
    confidence: partial
design:
  visual_style: Editorial, calm, and credibility-led with restrained decorative treatment.
  colors:
    primary:
      value: "#164E63"
      basis: Inferred
      approximate: true
    surface:
      value: "#F8FAFC"
      basis: Observed
      approximate: true
    text:
      value: "#0F172A"
      basis: Default
      approximate: false
  typography:
    heading:
      value: Editorial sans-serif or serif-sans pairing selected by the new brand.
      basis: Inferred
      approximate: false
    body:
      value: Neutral sans-serif with readable line height.
      basis: Observed
      approximate: false
  spacing:
    value: Generous vertical sections using a four- or eight-point scale.
    basis: Inferred
    approximate: true
  borders:
    value: Subtle one-pixel neutral borders with moderate radius.
    basis: Inferred
    approximate: true
  shadows:
    value: Minimal shadows; use contrast and spacing before elevation.
    basis: Default
    approximate: false
layout:
  container: Centered responsive container with a readable maximum width.
  grid: One column on mobile, two-column hero, and three-column evidence grid on larger screens.
  responsive: Collapse supporting columns without hiding required content or actions.
navigation:
  variant: Utility-free primary navigation with a prominent contact action.
  behavior: Desktop horizontal navigation; accessible disclosure navigation on mobile.
pages:
  - type: home
    purpose: Explain the service proposition, establish credibility, and lead to an enquiry.
    sections:
      - component: navigation
        variant: primary
      - component: hero
        variant: split-conversion
      - component: feature-grid
        variant: service-evidence
      - component: testimonials
        variant: proof-cards
      - component: cta
        variant: full-width-enquiry
      - component: footer
        variant: information-footer
components:
  - name: navigation
    type: navigation
    purpose: Let visitors reach key pages and the enquiry path.
    variant: primary
    configuration:
      content_structure:
        - logo-or-wordmark
        - navigation-items
        - primary-cta
    responsive_behavior: Replace links with an accessible disclosure menu on narrow screens.
  - name: hero
    type: hero
    purpose: Communicate the value proposition and primary conversion action.
    variant: split-conversion
    configuration:
      content_structure:
        - eyebrow
        - heading
        - description
        - primary-cta
        - secondary-cta
        - contextual-media
    responsive_behavior: Stack content before media and preserve CTA visibility on narrow screens.
  - name: feature-grid
    type: feature-grid
    purpose: Explain a concise set of services or outcomes.
    variant: service-evidence
    configuration:
      columns:
        desktop: 3
        mobile: 1
    responsive_behavior: Reduce to one column while preserving card order and spacing.
  - name: testimonials
    type: testimonials
    purpose: Provide approved social proof.
    variant: proof-cards
    configuration:
      requirement: Use only approved, attributable testimonials.
    responsive_behavior: Stack cards or use an accessible non-auto-rotating carousel.
  - name: cta
    type: cta
    purpose: Repeat the enquiry action after supporting evidence.
    variant: full-width-enquiry
    configuration:
      content_structure:
        - heading
        - supporting-copy
        - primary-cta
    responsive_behavior: Keep the primary action reachable without hover.
  - name: footer
    type: footer
    purpose: Provide secondary navigation, legal links, and contact information.
    variant: information-footer
    configuration:
      content_structure:
        - secondary-navigation
        - legal-links
        - contact-details
    responsive_behavior: Stack groups with logical reading order.
patterns:
  - name: Credibility before conversion
    category: ux
    description: Place service evidence and approved proof before the final enquiry prompt.
    basis: Inferred
  - name: Reusable evidence cards
    category: component
    description: Use one card pattern for services, outcomes, or differentiators.
    basis: Observed
responsive:
  mobile: Stack all multi-column content and use accessible navigation disclosure behavior.
  tablet: Use two-column layouts only when content remains readable and touch targets remain spacious.
  desktop: Use centered container, horizontal navigation, and multi-column evidence grid.
seo:
  recommended_structure:
    - One descriptive title and meta description per page.
    - One h1 and sequential headings that describe user-relevant sections.
    - Canonical URL and Open Graph metadata when production URLs and assets are available.
traceability:
  - decision: Split conversion hero
    basis: Observed
    note: Generalized from the fictional source's lead section without copying copy or media.
  - decision: Three-column evidence grid
    basis: Observed
    note: Reusable card pattern, not source-specific content.
  - decision: Accessible mobile navigation behavior
    basis: Default
    note: Safe implementation requirement because the source's responsive behavior was unknown.
